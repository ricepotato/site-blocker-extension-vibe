<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>차단된 사이트</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fef9f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #202124;
    }

    .card {
      text-align: center;
      max-width: 480px;
      padding: 48px 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .shield {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #c0392b;
      margin-bottom: 12px;
    }

    .domain-badge {
      display: inline-block;
      background: #fdecea;
      color: #c0392b;
      padding: 6px 16px;
      border-radius: 20px;
      font-family: monospace;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn-back {
      padding: 10px 24px;
      background: #c0392b;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-back:hover {
      background: #a93226;
    }

    .btn-close {
      padding: 10px 24px;
      background: transparent;
      color: #5f6368;
      border: 1.5px solid #dadce0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-close:hover {
      border-color: #c0392b;
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>위험한 사이트가 차단되었습니다</h1>
    <div class="domain-badge" id="blocked-domain">알 수 없는 도메인</div>
    <p>
      이 사이트는 피싱 또는 악성 사이트로 차단 목록에 등록되어 있습니다.<br/>
      접속을 중단하고 뒤로 돌아가거나 탭을 닫으세요.
    </p>
    <div class="btn-group">
      <button class="btn-back" onclick="history.go(-2)">이전 페이지로</button>
      <button class="btn-close" onclick="window.close()">탭 닫기</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const domain = params.get("domain");
    if (domain) {
      document.getElementById("blocked-domain").textContent = domain;
      document.title = `차단됨: ${domain}`;
    }
  </script>
</body>
</html>
